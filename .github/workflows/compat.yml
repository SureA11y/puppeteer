name: Compat

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  latest-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm install --no-save @surea11y/core@latest @surea11y/binding-base@latest
      - run: npx puppeteer browsers install firefox
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm test
